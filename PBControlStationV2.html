<!DOCTYPE html>
<html>

<head>
    <title>Project Blue - Ultimate Client (Milk-V Duo S)</title>
    <meta charset="utf-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap');

        :root {
            --bg-color: #050505;
            --panel-bg: rgba(20, 25, 35, 0.7);
            --text-color: #e0faff;
            --primary: #00f2ff;
            --neon-cyan: #00f2ff;
            --neon-blue: #0077ff;
            --success: #00ffaa;
            --error: #ff3366;
            --warning: #ffcc00;
            --border: rgba(0, 242, 255, 0.3);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #101520 0%, #050505 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
        }

        h2 {
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--primary);
            text-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
            margin-bottom: 30px;
        }

        .control-panel {
            display: flex;
            align-items: center;
            gap: 20px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: var(--glass-shadow);
            margin-bottom: 30px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .control-panel:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.15);
        }

        input[type="text"] {
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 242, 255, 0.2);
            color: white;
            border-radius: 8px;
            width: 180px;
            font-family: 'Outfit', sans-serif;
            outline: none;
            transition: border 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            padding: 10px 24px;
            border: 1px solid transparent;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            color: white;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            font-size: 0.8em;
            letter-spacing: 1px;
            background: rgba(255, 255, 255, 0.05);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        .connect {
            background: rgba(0, 255, 170, 0.15) !important;
            border-color: var(--success) !important;
            color: var(--success);
        }

        .disconnect {
            background: rgba(255, 51, 102, 0.15) !important;
            border-color: var(--error) !important;
            color: var(--error);
        }

        .fullscreen {
            background: rgba(0, 119, 255, 0.15) !important;
            border-color: var(--neon-blue) !important;
            color: var(--neon-blue);
        }

        .ping {
            background: rgba(255, 204, 0, 0.15) !important;
            border-color: var(--warning) !important;
            color: var(--warning);
        }

        #frameContainer {
            position: relative;
            width: 800px;
            height: 600px;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
            background-color: #000;
            overflow: hidden;
            cursor: crosshair;
            transition: all 0.5s ease;
        }

        #glCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            width: 800px;
            margin-top: 15px;
            font-size: 0.85em;
            letter-spacing: 1px;
            color: rgba(0, 242, 255, 0.7);
        }

        #fpsDisplay {
            color: var(--primary);
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.3);
        }

        body.fullscreen-mode .control-panel,
        body.fullscreen-mode .status-bar,
        body.fullscreen-mode h2,
        body.fullscreen-mode .info {
            display: none;
        }

        body.fullscreen-mode #frameContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            border-radius: 0;
            margin: 0;
            z-index: 1000;
        }

        .info {
            margin-top: 30px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            text-align: center;
            max-width: 800px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #frameContainer::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.05) 50%);
            background-size: 100% 2px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.1;
        }

        .audio-hidden {
            display: none;
        }
    </style>
</head>

    <script id="decoder-worker" type="javascript/worker">
        const worker_lut = new Uint32Array(256);
        for (let i = 0; i < 256; i++) {
            const r3 = (i >> 5) & 0x07;
            const g3 = (i >> 2) & 0x07;
            const b2 = i & 0x03;
                        const r8 = (r3 << 5) | (r3 << 2) | (r3 >> 1);
            const g8 = (g3 << 5) | (g3 << 2) | (g3 >> 1);
            const b8 = (b2 << 6) | (b2 << 4) | (b2 << 2) | b2;
            worker_lut[i] = r8 | (g8 << 8) | (b8 << 16) | (255 << 24);
        }

        const WIDTH = 800;
        const HEIGHT = 600;

        self.onmessage = function(e) {
            try {
                const ab = e.data.buffer;
                const type = e.data.type || 0x02;
                if (!ab) return;

                if (type === 0x04) {                     if (ab.byteLength < 9) return;
                    const headerView = new DataView(ab, 1, 8);
                    const winX = headerView.getUint16(0, true);
                    const winY = headerView.getUint16(2, true);
                    const winW = headerView.getUint16(4, true);
                    const winH = headerView.getUint16(6, true);

                    const jpegBlob = new Blob([ab.slice(9)], { type: 'image/jpeg' });
                    createImageBitmap(jpegBlob).then(bitmap => {
                        const canvas = new OffscreenCanvas(winW, winH);
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(bitmap, 0, 0, winW, winH);
                        const imageData = ctx.getImageData(0, 0, winW, winH).data;

                        const total = winW * winH;
                        const pixels = new Uint32Array(total);

                        for (let i = 0; i < total; i++) {
                            const r = imageData[i * 4];
                            const g = imageData[i * 4 + 1];
                            const b = imageData[i * 4 + 2];
                            pixels[i] = r | (g << 8) | (b << 16) | (255 << 24);
                        }
                        self.postMessage({ y: winY, w: winW, h: winH, pixels: pixels, isFullFrame: false, videoX: winX }, [pixels.buffer]);
                    }).catch(err => {
                        console.error("JPEG Decode Error:", err);
                    });
                    return;
                }

                if (ab.byteLength < 1) return;
                const view = new DataView(ab);
                const mode = view.getUint8(0);

                if (mode === 6) {                     if (ab.byteLength < 13) return; 
                    const x = view.getUint16(1, true);
                    const y = view.getUint16(3, true);
                    const w = view.getUint16(5, true);
                    const h = view.getUint16(7, true);
                    const rleLen = view.getUint32(9, true);
                    let offset = 13;

                    if (offset + rleLen > ab.byteLength) return;
                    const rle = new Uint8Array(ab, offset, rleLen);
                    let rleIdx = 0, pxIdx = 0;
                    const total = w * h;
                    const runPixels = new Uint32Array(total);

                    while (rleIdx < rleLen && pxIdx < total) {
                        if (rleIdx + 3 > rleLen) break;
                        const count = rle[rleIdx++];
                        const c16 = (rle[rleIdx++] << 8) | rle[rleIdx++];
                                                const r = (c16 >> 8) & 0xFF;
                        const g = ((c16 >> 4) & 0x0F) << 4;
                        const b = (c16 & 0x0F) << 4;
                        const color32 = r | (g << 8) | (b << 16) | (255 << 24);
                        runPixels.fill(color32, pxIdx, Math.min(pxIdx + count, total));
                        pxIdx += count;
                    }

                    self.postMessage({ videoX: x, y: y, w: w, h: h, pixels: runPixels, isFullFrame: false }, [runPixels.buffer]);
                    return;
                }

                if (mode === 5) {                     if (ab.byteLength < 4) return;
                    const isFullSync = view.getUint8(1) === 1;
                    const isFrameEnd = view.getUint8(2) === 1;
                    const stripeCount = view.getUint8(3);
                    const headerSize = view.getUint8(0);
                    let offset = headerSize + 4;

                    const runsToPost = [];

                    for (let s = 0; s < stripeCount; s++) {
                        if (offset + 6 > ab.byteLength) break;
                        const y = view.getUint16(offset);
                        const h = view.getUint16(offset + 2);
                        const runCount = view.getUint8(offset + 4);
                        offset += 6;

                        for (let r = 0; r < runCount; r++) {
                            if (offset + 6 > ab.byteLength) break;
                            const startX = view.getUint16(offset);
                            const runW = view.getUint16(offset + 2);
                            const rleLen = view.getUint16(offset + 4);
                            offset += 6;

                            if (offset + rleLen > ab.byteLength) break;
                            const rle = new Uint8Array(ab, offset, rleLen);
                            let rleIdx = 0, pxIdx = 0;
                            const total = runW * h;
                            const runPixels = new Uint32Array(total);

                            while (rleIdx < rleLen && pxIdx < total) {
                                if (rleIdx + 3 > rleLen) break;
                                const count = rle[rleIdx++];
                                const c16 = (rle[rleIdx++] << 8) | rle[rleIdx++];
                                                                const rr = (c16 >> 8) & 0xFF;
                                const gg = ((c16 >> 4) & 0x0F) << 4;
                                const bb = (c16 & 0x0F) << 4;
                                const color32 = rr | (gg << 8) | (bb << 16) | (255 << 24);
                                runPixels.fill(color32, pxIdx, Math.min(pxIdx + count, total));
                                pxIdx += count;
                            }

                            runsToPost.push({ videoX: startX, y: y, w: runW, h: h, pixels: runPixels });
                            offset += rleLen;
                        }
                    }

                    if (runsToPost.length > 0 || isFrameEnd) {
                        const transferList = runsToPost.map(r => r.pixels.buffer);
                        self.postMessage({ runs: runsToPost, isFullFrame: isFullSync, isFrameEnd: isFrameEnd }, transferList);
                    }
                    return;
                }
            } catch (err) {
                console.error("Worker Decode Error:", err);
            }
        };
    </script>

        function playSfx(id) {
            if (!sfxCtx) return;
            const t = sfxCtx.currentTime;
            const osc = sfxCtx.createOscillator();
            const gain = sfxCtx.createGain();
            osc.connect(gain);
            gain.connect(sfxCtx.destination);

            switch (id) {
                case "EXPLOSION":
                    const bufferSize = sfxCtx.sampleRate * 0.5;
                    const buffer = sfxCtx.createBuffer(1, bufferSize, sfxCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                    const noise = sfxCtx.createBufferSource();
                    noise.buffer = buffer;
                    const noiseGain = sfxCtx.createGain();
                    noise.connect(noiseGain);
                    noiseGain.connect(sfxCtx.destination);
                    noiseGain.gain.setValueAtTime(0.5, t);
                    noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
                    noise.start();
                    break;
                case "LASER":
                    osc.type = "square";
                    osc.frequency.setValueAtTime(880, t);
                    osc.frequency.exponentialRampToValueAtTime(110, t + 0.15);
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
                    osc.start();
                    osc.stop(t + 0.2);
                    break;
                case "LEVELUP":
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(440, t);
                    osc.frequency.setValueAtTime(880, t + 0.1);
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.linearRampToValueAtTime(0, t + 0.5);
                    osc.start();
                    osc.stop(t + 0.5);
                    break;
                case "GAMEOVER":
                    osc.type = "sawtooth";
                    osc.frequency.setValueAtTime(110, t);
                    osc.frequency.linearRampToValueAtTime(55, t + 0.5);
                    gain.gain.setValueAtTime(0.2, t);
                    gain.gain.linearRampToValueAtTime(0, t + 0.5);
                    osc.start();
                    osc.stop(t + 0.5);
                    break;
                case "SHOTGUN":
                    if (!shotgunBuffer) {
                        decodeShotgunSFX().then(() => playSfx("SHOTGUN"));
                        break;
                    }
                    const source = sfxCtx.createBufferSource();
                    source.buffer = shotgunBuffer;
                    const shotGain = sfxCtx.createGain();
                    shotGain.gain.setValueAtTime(2.0, t);                     source.connect(shotGain);
                    shotGain.connect(sfxCtx.destination);
                    source.start(t);
                    break;
                case "IMPACT":
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(440, t);
                    osc.frequency.exponentialRampToValueAtTime(80, t + 0.1);
                    gain.gain.setValueAtTime(0.05, t);
                    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                    osc.start();
                    osc.stop(t + 0.1);
                    break;
                case "DUCK_YELP":
                                        osc.type = "sine";
                    osc.frequency.setValueAtTime(880, t);
                    osc.frequency.exponentialRampToValueAtTime(1200, t + 0.05);
                    osc.frequency.exponentialRampToValueAtTime(880, t + 0.1);
                    gain.gain.setValueAtTime(0.2, t);
                    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                    osc.start();
                    osc.stop(t + 0.1);
                    break;
            }
        }

                            mp4VideoElement.onplaying = () => {
                                const pEl = document.getElementById('mp4Progress');
                                if (pEl) {
                                    pEl.style.opacity = '0';
                                    setTimeout(() => { if (pEl) pEl.remove(); }, 500);
                                }
                            };
                            mp4VideoElement._ms = ms;
                            mp4VideoElement.src = URL.createObjectURL(ms);
                            ms.addEventListener('sourceopen', () => {
                                try {
                                    const sb = ms.addSourceBuffer('video/mp4; codecs="avc1.42E01E, mp4a.40.2"');
                                    sb.mode = 'sequence';
                                    mp4VideoElement._sb = sb;
                                } catch (e) { console.error("MSE error:", e); }
                            });
                        }

                        const container = document.getElementById('frameContainer');
                        if (!container) return;
                                                const sX = container.clientWidth / (frameWidth || 800);
                        const sY = container.clientHeight / (frameHeight || 600);

                        const pDiv = document.createElement('div');
                        pDiv.id = 'mp4Progress';
                        pDiv.style.cssText = `
                            position:absolute; left:${mp4WindowRect.x * sX}px; top:${mp4WindowRect.y * sY}px;
                            width:${mp4WindowRect.w * sX}px; height:${mp4WindowRect.h * sY}px;
                            background:rgba(0,0,0,0.85); display:flex; flex-direction:column;
                            align-items:center; justify-content:center; z-index:200; color:white;
                            transition: opacity 0.5s; font-family: sans-serif;
                        `;
                        pDiv.innerHTML = `
                            <div style="font-size:16px; font-weight:bold; margin-bottom:12px;" class="label">Initializing...</div>
                            <div style="width:70%; height:6px; background:#222; border-radius:3px; overflow:hidden; border:1px solid #444">
                                <div class="bar" style="height:100%; width:0%; background:#2196F3; transition:width 0.2s"></div>
                            </div>
                        `;
                        container.appendChild(pDiv);

                                                const overlay = document.createElement('div');
                        overlay.id = 'mp4Overlay';
                        overlay.style.cssText = `
                            position:absolute; left:${mp4WindowRect.x * sX}px; top:${mp4WindowRect.y * sY}px;
                            width:${mp4WindowRect.w * sX}px; height:${mp4WindowRect.h * sY}px;
                            background:black; z-index:100; pointer-events:none; border: 1px solid #444; border-radius:4px;
                        `;
                        if (!mp4VideoElement) mp4VideoElement = document.createElement('video');
                        mp4VideoElement.style.cssText = `width:100%; height:100%; object-fit:contain;`;
                        overlay.appendChild(mp4VideoElement);
                        container.appendChild(overlay);

                        console.log(`MP4 Pipeline ready: ${(mp4ExpectedSize / 1024 / 1024).toFixed(1)}MB`);
                    } else if (cmd.startsWith("MP4:END")) {
                        console.log("Browser received MP4:END. Accumulated: " + mp4Chunks.length + " chunks");
                                                if (mp4VideoElement && mp4VideoElement._ms && mp4VideoElement._ms.readyState === 'open') {
                            try { if (!mp4VideoElement._sb.updating) mp4VideoElement._ms.endOfStream(); } catch (e) { }
                        }
                                                if (mp4VideoElement && (mp4VideoElement.paused || mp4VideoElement.currentTime === 0)) {
                            console.log("Progressive playback didn't start. Falling back to full Blob playback.");
                            const blob = new Blob(mp4Chunks, { type: 'video/mp4' });
                            mp4BlobUrl = URL.createObjectURL(blob);
                            mp4VideoElement.src = mp4BlobUrl;
                            mp4VideoElement.play().catch(e => console.log('Auto-play blocked:', e));
                        }
                        const pEl = document.getElementById('mp4Progress');
                        if (pEl) setTimeout(() => { if (pEl) pEl.style.opacity = '0'; }, 1000);
                        console.log(`MP4 transfer complete: ${(mp4ReceivedSize / 1024 / 1024).toFixed(1)}MB received`);
                    } else if (cmd.startsWith("MP4:MOVE:")) {
                        const parts = cmd.substring(9).split(':');
                        if (parts.length >= 4) {
                            mp4WindowRect = {
                                x: parseInt(parts[0]), y: parseInt(parts[1]),
                                w: parseInt(parts[2]), h: parseInt(parts[3])
                            };
                            const container = document.getElementById('frameContainer');
                            const sx = container.clientWidth / (frameWidth || 800);
                            const sy = container.clientHeight / (frameHeight || 600);
                            const overlay = document.getElementById('mp4Overlay');
                            if (overlay) {
                                overlay.style.left = (mp4WindowRect.x * sx) + 'px';
                                overlay.style.top = (mp4WindowRect.y * sy) + 'px';
                                overlay.style.width = (mp4WindowRect.w * sx) + 'px';
                                overlay.style.height = (mp4WindowRect.h * sy) + 'px';
                            }
                            const prog = document.getElementById('mp4Progress');
                            if (prog) {
                                prog.style.left = (mp4WindowRect.x * sx) + 'px';
                                prog.style.top = (mp4WindowRect.y * sy) + 'px';
                                prog.style.width = (mp4WindowRect.w * sx) + 'px';
                                prog.style.height = (mp4WindowRect.h * sy) + 'px';
                            }
                        }
                    } else if (cmd === "MP4:PLAY") {
                        console.log("Remote PLAY command received");
                        if (mp4VideoElement) mp4VideoElement.play().catch(e => console.log('Remote play blocked:', e));
                    } else if (cmd === "MP4:PAUSE") {
                        console.log("Remote PAUSE command received");
                        if (mp4VideoElement) mp4VideoElement.pause();
                    } else if (cmd === "MP4:STOP" || cmd === "MP4:CLOSE" || cmd === "MP4:HIDE") {
                        console.log(`Remote ${cmd} command received`);
                        cleanupMP4Player();
                    }
                                        else if (cmd.startsWith("YT:PLAY:")) {
                        const parts = cmd.substring(8).split(':');
                        let url = parts[0];
                        if (parts.length > 5) {
                            url = parts.slice(0, parts.length - 4).join(':');
                        }

                        const rectParts = parts.slice(-4);
                        ytWindowRect = {
                            x: parseInt(rectParts[0]) || 0, y: parseInt(rectParts[1]) || 0,
                            w: parseInt(rectParts[2]) || 336, h: parseInt(rectParts[3]) || 200
                        };

                        currentSiteType = detectSiteType(url);
                        console.log('WebPlayer Navigating to: ' + url + ' (type: ' + currentSiteType + ')', ytWindowRect);
                        cleanupYTPlayer();
                        currentSiteType = detectSiteType(url); 
                        const container = document.getElementById('frameContainer');
                        if (!container) {
                            console.error('CRITICAL: frameContainer not found!');
                            return;
                        }

                        const sx = container.clientWidth / (frameWidth || 800);
                        const sy = container.clientHeight / (frameHeight || 600);

                        ytOverlay = document.createElement('div');
                        ytOverlay.id = 'ytOverlay';
                        ytOverlay.style.cssText = `
                            position: absolute;
                            left: ${ytWindowRect.x * sx}px;
                            top: ${ytWindowRect.y * sy}px;
                            width: ${ytWindowRect.w * sx}px;
                            height: ${ytWindowRect.h * sy}px;
                            z-index: 2000;
                            background: black;
                            border: 1px solid #333;
                            border-radius: 4px;
                            overflow: hidden;
                            pointer-events: auto;
                        `;

                        ytIframe = document.createElement('iframe');
                        ytIframe.id = 'browserIframe';
                        ytIframe.style.cssText = 'width:100%; height:100%; border:none;';
                        ytIframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
                        ytIframe.allowFullscreen = true;
                        ytIframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-forms allow-presentation');

                        const finalUrl = convertToEmbedUrl(url);
                        console.log('Final Iframe URL:', finalUrl);
                        ytIframe.src = finalUrl;

                        ytOverlay.appendChild(ytIframe);
                        container.appendChild(ytOverlay);

                    } else if (cmd === "YT:PAUSE") {
                        console.log('WebPlayer PAUSE (site: ' + currentSiteType + ')');
                        if (ytIframe && ytIframe.contentWindow) {
                            if (currentSiteType === 'youtube') {
                                ytIframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
                            } else {
                                                                try {
                                    ytIframe.contentWindow.postMessage({ action: 'pause' }, '*');
                                } catch (e) { console.log('Cross-origin pause blocked, expected for: ' + currentSiteType); }
                            }
                        }
                    } else if (cmd === "YT:RESUME") {
                        console.log('WebPlayer RESUME (site: ' + currentSiteType + ')');
                        if (ytIframe && ytIframe.contentWindow) {
                            if (currentSiteType === 'youtube') {
                                ytIframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                            } else {
                                try {
                                    ytIframe.contentWindow.postMessage({ action: 'play' }, '*');
                                } catch (e) { console.log('Cross-origin resume blocked, expected for: ' + currentSiteType); }
                            }
                        }
                    } else if (cmd === "YT:STOP") {
                        console.log('WebPlayer STOP');
                        cleanupYTPlayer();
                    } else if (cmd.startsWith("YT:MOVE:")) {
                        const parts = cmd.substring(8).split(':');
                        if (parts.length >= 4) {
                            ytWindowRect = {
                                x: parseInt(parts[0]), y: parseInt(parts[1]),
                                w: parseInt(parts[2]), h: parseInt(parts[3])
                            };
                            const container = document.getElementById('frameContainer');
                            if (container && ytOverlay) {
                                const sx = container.clientWidth / (frameWidth || 800);
                                const sy = container.clientHeight / (frameHeight || 600);
                                ytOverlay.style.left = (ytWindowRect.x * sx) + 'px';
                                ytOverlay.style.top = (ytWindowRect.y * sy) + 'px';
                                ytOverlay.style.width = (ytWindowRect.w * sx) + 'px';
                                ytOverlay.style.height = (ytWindowRect.h * sy) + 'px';
                            }
                        }
                    }
                }
            };

            uiSocket.onclose = () => {
                connectButton.textContent = "Connect";
                connectButton.className = "connect";
                statusDiv.textContent = "Connection Lost";
                statusDiv.style.color = "var(--error)";
                uiSocket = null;
                disconnectAudioThrottle();
                handleAudioStop();                 textureInitialized = false;
            };

            uiSocket.onerror = (error) => {
                console.error("WS Error", error);
                if (uiSocket) uiSocket.close();
            };
        };

                        const SPECIAL_KEYS = {
            "ArrowUp": "ArrowUp", "ArrowDown": "ArrowDown", "ArrowLeft": "ArrowLeft", "ArrowRight": "ArrowRight",
            "Enter": "Enter", "Space": "Space", "Escape": "Esc", "Backspace": "Backspace", "Tab": "Tab",
            "ShiftLeft": "Shift", "ShiftRight": "Shift", "ControlLeft": "Ctrl", "ControlRight": "Ctrl"
        };

        function sendInput(msg) {
            console.log("WS Sending:", msg);
            if (uiSocket && uiSocket.readyState === WebSocket.OPEN) uiSocket.send(msg);
        }

        window.addEventListener('keydown', (e) => {
            if (!uiSocket || e.repeat) return;
            let k = SPECIAL_KEYS[e.code] || SPECIAL_KEYS[e.key] || (e.key.length === 1 ? e.key : null);

            if (k) {
                                if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(k)) {
                    e.preventDefault();
                }

                sendInput(k.length === 1 ? `keyb:char:${k}` : `keyb:key:${k}`);
            }
        });

        const frameEl = document.getElementById('frameContainer');
        frameEl.onmousedown = (e) => sendMouse('down', e);
        frameEl.onmouseup = (e) => sendMouse('up', e);
        frameEl.onmousemove = (e) => sendMouse('move', e);

                frameEl.addEventListener('wheel', (e) => handleMouseWheel(e), { passive: false });

        let lastMouseTime = 0;
        function sendMouse(type, e) {
            const now = performance.now();
            if (type === 'move' && (now - lastMouseTime < MOUSE_THROTTLE_MS)) return;
            if (type === 'move') lastMouseTime = now;

            const r = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - r.left) * (frameWidth / r.width));
            const y = Math.floor((e.clientY - r.top) * (frameHeight / r.height));

            let mval = e.buttons !== undefined ? e.buttons : 0;
            if (type === 'wheel') mval = e.deltaY > 0 ? 1 : -1;

            if (x >= 0 && x < frameWidth && y >= 0 && y < frameHeight) {
                sendInput(`mouse:${type}:${x},${y}:${mval}`);
            }
        }

                function handleMouseWheel(e) {
            e.preventDefault(); 
            const now = performance.now();
            if (now - lastWheelSendTime < WHEEL_THROTTLE_MS) return;
            lastWheelSendTime = now;

            const r = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - r.left) * (frameWidth / r.width));
            const y = Math.floor((e.clientY - r.top) * (frameHeight / r.height));

                                                let delta = 0;

            if (e.deltaMode === 0) {
                                delta = Math.sign(e.deltaY) * -1;             } else if (e.deltaMode === 1) {
                                delta = Math.sign(e.deltaY) * -1;
            } else {
                                delta = Math.sign(e.deltaY) * -3;
            }

                        delta = Math.max(-3, Math.min(3, delta));

                        if (x >= 0 && x < frameWidth && y >= 0 && y < frameHeight) {
                                sendInput(`wheel:${x},${y},${delta}`);
            }
        }

        fullScreenBtn.onclick = () => {
            if (!document.fullscreenElement) frameEl.requestFullscreen();
            else document.exitFullscreen();
        };

        document.addEventListener('fullscreenchange', () => {
            document.body.classList.toggle('fullscreen-mode', !!document.fullscreenElement);
        });

        const saved = localStorage.getItem('esp32_ip');
        if (saved) ipInput.value = saved;

    </script>
